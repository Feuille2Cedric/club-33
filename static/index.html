<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Club 33</title><link rel="stylesheet" href="./style.css"><script src="./config.js"></script><script src="./data.js"></script><script src="./app.js" defer></script></head><body>
<header><a href="./" class="logo">club33<span>●</span></a><button id="change-profile" hidden></button></header>
<main><p id="connection" role="status">Chargement…</p>
<section id="welcome"><h1>Qui es-tu ?</h1><div id="profiles" class="profiles"></div><button class="add-person">＋ Ajouter une personne</button></section>
<section id="club" hidden><div class="toolbar"><div><h1 id="week-title">Cette semaine</h1><p id="week-dates"></p></div><div class="navigation"><button id="previous" aria-label="Semaine précédente">←</button><button id="today">Aujourd’hui</button><button id="next" aria-label="Semaine suivante">→</button></div></div>
<div class="actions"><button id="add" class="primary">＋ Proposer un album</button><button class="add-person">＋ Une personne</button><span id="progress"></span></div><div id="albums" class="albums"></div><details class="history"><summary>Historique des semaines</summary><div id="history"></div></details></section></main>
<dialog id="member-dialog"><form id="member-form"><div class="dialog-heading"><h2>Ajouter une personne</h2><button type="button" class="close" aria-label="Fermer">×</button></div><label>Prénom<input name="name" maxlength="40" required></label><p class="form-error" role="alert"></p><button class="primary">Ajouter</button></form></dialog>
<dialog id="album-dialog"><form id="album-form"><div class="dialog-heading"><h2>Proposer un album</h2><button type="button" class="close" aria-label="Fermer">×</button></div><label>Rechercher sur Deezer<input id="album-search" type="search" maxlength="160" autocomplete="off" placeholder="Un album, un artiste…" aria-describedby="search-status"></label><p id="search-status" role="status"></p><div id="search-results"></div><div id="selected-album" hidden></div><input name="cover_url" type="hidden"><input name="spotify_url" type="hidden"><input name="deezer_url" type="hidden"><details id="manual-fields"><summary>Saisie manuelle</summary><label>Album<input name="title" maxlength="120" required></label><label>Artiste<input name="artist" maxlength="120" required></label><label>Lien d’écoute (facultatif)<input name="link" type="url" maxlength="2000"></label></details><p class="form-error" role="alert"></p><button class="primary">Partager</button></form></dialog>
<div id="toast" role="status" hidden></div></body></html>
